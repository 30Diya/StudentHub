<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Register</title>
    <link rel="stylesheet" href="../CSS/register.css">
</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left">
        <div class="overlay"></div>
        <div class="left-content">
            <h1>STUDENT<span>HUB</span></h1>
            <h2>Start Your Journey.</h2>
            <p>
                Create your StudentHub account and manage
                your assignments, events and academic progress
                in one place.
            </p>
        </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right">
        <div class="register-box">

            <h1>STUDENT<span>HUB</span></h1>
            <p class="portal">Student Portal</p>
            <h2>Create Account</h2>
            <p class="text">Register to get started with StudentHub</p>

            <form action="../PHP/process_registration_db.php" method="post">

                <div class="row">
                    <div class="field">
                        <label>Full Name</label>
                        <input type="text" name="full_name" placeholder="Enter your name" required>
                    </div>
                    <div class="field">
                        <label>Student ID</label>
                        <input type="text" name="student_id" placeholder="Enter student ID" required>
                    </div>
                </div>

                <label>Email</label>
                <input type="email" name="email" placeholder="Enter your email" required>

                <label>Mobile Number</label>
                <input type="tel" name="mobile" placeholder="Enter mobile number" required>

                <div class="row">
                    <div class="field">
                        <label>Password</label>
                        <input type="password" name="password" placeholder="Password" required>
                    </div>
                    <div class="field">
                        <label>Confirm Password</label>
                        <input type="password" name="confirm_password" placeholder="Confirm password" required>
                    </div>
                </div>

                <label>Course</label>
                <select name="course" required>
                    <option value="">Select your course</option>
                    <option>Information Technology</option>
                    <option>Computer Science</option>
                    <option>Software Engineering</option>
                    <option>Business Management</option>
                </select>

                <div class="terms">
                    <input type="checkbox" name="terms" required>
                    <span>I agree to the Terms and Conditions.</span>
                </div>

                <button type="submit">Create Account</button>

            </form>

            <p class="login">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>
    </div>

</div>

<script src="../JS/theme.js"></script>
<script src="../JS/register.js"></script>
</body>
</html>
