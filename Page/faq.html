<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub - FAQ</title>

    <link rel="stylesheet" href="../CSS/faq.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">
        STUDENT<span>HUB</span>
    </div>

    <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="event.html">Event</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="profile.html">Profile</a></li>
    </ul>

    <div class="profile">S</div>

</nav>


<!-- ================= FAQ HEADER ================= -->

<section class="faq-header">

    <p>STUDENTHUB SUPPORT</p>

    <h1>
        Frequently Asked
        <span>Questions</span>
    </h1>

    <h4>
        Find quick answers to common questions about StudentHub.
    </h4>


    <!-- Search -->

    <div class="search">

        🔍

        <input
            type="text"
            id="search"
            placeholder="Search your question..."
        >

    </div>

</section>


<!-- ================= FILTERS ================= -->

<section class="filters">

    <div class="filter-item">

        <label for="categoryFilter">
            Category
        </label>

        <select id="categoryFilter">

            <option value="all">
                All Categories
            </option>

        </select>

    </div>


    <div class="filter-item">

        <label for="sort">

            Sort

        </label>

        <select id="sort">

            <option value="default">
                Default
            </option>

            <option value="az">
                Question A-Z
            </option>

            <option value="za">
                Question Z-A
            </option>

        </select>

    </div>

</section>


<!-- ================= RESULT INFORMATION ================= -->

<div class="result-info">

    <p id="resultMessage">
        Loading FAQs...
    </p>

</div>


<!-- ================= FAQ CONTENT ================= -->

<div class="container">

    <div id="faqContainer">

        <!-- FAQs will be loaded from faqs.json -->

    </div>

</div>


<!-- ================= PAGINATION ================= -->

<div class="pagination" id="pagination">

    <!-- Pagination buttons generated by JavaScript -->

</div>


<!-- ================= HELP ================= -->

<div class="help">

    <h2>
        Still need help?
    </h2>

    <p>
        Our support team is ready to help you.
    </p>

    <a href="contact.html">
        Contact Us →
    </a>

</div>


<!-- ================= SCRIPTS ================= -->

<script src="../JS/theme.js"></script>

<script src="../JS/faq.js"></script>

</body>

</html>
