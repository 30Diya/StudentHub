<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Login</title>
    <link rel="stylesheet" href="../CSS/login.css">
</head>

<body>

<div class="login-page">

    <!-- Left Image Side -->
    <div class="image-side">
        <img src="https://images.unsplash.com/photo-1487700160041-babef9c3cb55?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTF8fGxvZ2lufGVufDB8fDB8fHww" alt="StudentHub">
        
        <div class="image-text">
            <h1>STUDENT<span>HUB</span></h1>
            <h2>Learn. Grow. Succeed.</h2>
            <p>
                Your all-in-one student platform for
                assignments, events, attendance and progress.
            </p>
        </div>
    </div>


    <!-- Right Login Side -->
    <div class="form-side">

        <div class="login-box">

            <div class="logo">STUDENT<span>HUB</span></div>

            <p class="portal">Student Portal</p>

            <h2>Welcome Back!</h2>
            <p class="description">
                Login to continue to your account
            </p>

            <form>

                <label>Email</label>
                <input type="email"
                       placeholder="Enter your email"
                       required>

                <label>Password</label>
                <input type="password"
                       placeholder="Enter your password"
                       required>

                <div class="options">
                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit">Login</button>

            </form>

            <p class="signup">
                Don't have an account?
                <a href="#">Sign Up</a>
            </p>

        </div>

    </div>

</div>
<script src="JS/theme.js"></script>
<script src="../JS/login.js"></script>
</body>
</html>
