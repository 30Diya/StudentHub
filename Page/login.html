
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub - Login</title>

    <link rel="stylesheet" href="../CSS/login.css">
</head>

<body>

<div class="login-page">

    <!-- LEFT IMAGE SIDE -->
    <div class="image-side">

        <img
            src="https://images.unsplash.com/photo-1487700160041-babef9c3cb55?w=600&auto=format&fit=crop&q=60"
            alt="StudentHub">

        <div class="image-text">
            <h1>STUDENT<span>HUB</span></h1>
            <h2>Learn. Grow. Succeed.</h2>

            <p>
                Your all-in-one student platform for
                assignments, events, attendance and progress.
            </p>
        </div>

    </div>

    <!-- RIGHT LOGIN SIDE -->
    <div class="form-side">

        <div class="login-box">

            <div class="logo">
                STUDENT<span>HUB</span>
            </div>

            <p class="portal">Student Portal</p>

            <h2>Welcome Back!</h2>

            <p class="description">
                Login to continue to your account
            </p>

            <!-- PHP LOGIN FORM -->
            <form action="../PHP/login.php" method="POST">

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="username"
                    required>

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>

                <div class="options">

                    <label class="remember">
                        <input
                            type="checkbox"
                            name="remember"
                            value="1">
                        Remember me
                    </label>

                    <a href="#" id="forgotPassword">
                        Forgot Password?
                    </a>

                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="signup">
                Don't have an account?
                <a href="register.html">Sign Up</a>
            </p>

        </div>

    </div>

</div>

</body>
</html>
